[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "workflow-engine"
version = "0.1.0"
description = "Durable PostgreSQL and Redis workflow engine"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.128,<1", "uvicorn>=0.40,<1", "pydantic-settings>=2.12,<3",
  "psycopg[binary,pool]>=3.3,<4", "redis>=7,<9", "limits>=5.8,<6", "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.14", "mypy>=1.19"]

[tool.hatch.build.targets.wheel]
packages = ["api", "orchestrator", "worker", "shared"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["component: API and submission tests with real PostgreSQL", "integration: real PostgreSQL and Redis", "docker: host-controlled Docker crash and recovery", "performance: opt-in isolated Docker capacity and memory tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
